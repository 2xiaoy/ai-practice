<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>我的 AI 助手</title>
    <style>
        body { font-family: sans-serif; max-width: 700px; margin: 40px auto; padding: 0 16px; }
        #chat { border: 1px solid #ddd; border-radius: 8px; height: 400px; overflow-y: auto; padding: 12px; margin-bottom: 12px; }
        .user { text-align: right; margin: 8px 0; }
        .ai { text-align: left; margin: 8px 0; }
        .bubble { display: inline-block; padding: 8px 12px; border-radius: 8px; max-width: 80%; }
        .user .bubble { background: #d1e7ff; }
        .ai .bubble { background: #f1f1f1; }
        #input-row { display: flex; gap: 8px; }
        #msg { flex: 1; padding: 8px; }
        button { padding: 8px 16px; }
    </style>
</head>
<body>
    <h2>我的 AI 助手</h2>
    <div id="chat"></div>
    <div id="input-row">
        <input id="msg" placeholder="输入消息..." autocomplete="off">
        <button onclick="send()">发送</button>
    </div>

    <script>
        async function send() {
            const input = document.getElementById("msg");
            const text = input.value.trim();
            if (!text) return;

            addMessage("user", text);
            input.value = "";

            const res = await fetch("/chat", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ message: text })
            });
            const data = await res.json();
            addMessage("ai", data.reply);
        }

        function addMessage(role, text) {
            const chat = document.getElementById("chat");
            const div = document.createElement("div");
            div.className = role;
            div.innerHTML = `<span class="bubble">${text}</span>`;
            chat.appendChild(div);
            chat.scrollTop = chat.scrollHeight;
        }

        document.getElementById("msg").addEventListener("keydown", function(e) {
            if (e.key === "Enter") send();
        });
    </script>
</body>
</html>
